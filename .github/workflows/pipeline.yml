name: Judge pipeline
run-name: Runs Lint and pytest checks
on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
    Run-Tests:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            
            - name: Set up python 3.12
              uses: actions/setup-python@v5
              with:
                python-version: '3.12'
                architecture: 'x64'
            
            - name: Install Dependencies
              run: pip install .
            
            - name: Run Ruff
              run: ruff check .
            
            - name: Check docker and version
              run: docker version && docker ps
              
            - name: Pull sandbox image
              run: docker pull python:3.12-slim

            - name: Run Pytest
              run: python -m pytest -v
              env:
                DOCKER_HOST: tcp://localhost:2375